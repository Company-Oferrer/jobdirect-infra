apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: jobdirect-alerts
  namespace: monitoring
spec:
  groups:
  - name: jobdirect.rules
    rules:

    - alert: PodDown
      expr: kube_pod_status_ready{condition="true"} == 0
      for: 2m
      labels:
        severity: critical
        environment: dev
      annotations:
        summary: "Pod caído"
        description: "El pod {{ $labels.pod }} en {{ $labels.namespace }} no está listo"

    - alert: HighCPUUsage
      expr: sum(rate(container_cpu_usage_seconds_total[5m])) by (pod) > 0.5
      for: 2m
      labels:
        severity: warning
        environment: dev
      annotations:
        summary: "Uso alto de CPU"
        description: "El pod {{ $labels.pod }} supera el 80% de CPU"

    - alert: NodeDown
      expr: up{job="node-exporter"} == 0
      for: 2m
      labels:
        severity: critical
        environment: dev
      annotations:
        summary: "Nodo caído"
        description: "El nodo {{ $labels.instance }} no responde"
