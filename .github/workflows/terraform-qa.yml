name: Deploy Infrastructure - QA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'terraform/qa/**'

jobs:
  terraform-qa:
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        working-directory: terraform/qa
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform/qa
        run: |
          terraform plan -no-color \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var="postgres_admin_password=${{ secrets.POSTGRES_ADMIN_PASSWORD_QA }}"

      - name: Terraform Apply
        working-directory: terraform/qa
        run: |
          terraform apply -auto-approve \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var="postgres_admin_password=${{ secrets.POSTGRES_ADMIN_PASSWORD_QA }}"

      - name: Get Outputs
        working-directory: terraform/qa
        run: |
          echo "## Terraform Outputs - QA" >> $GITHUB_STEP_SUMMARY
          terraform output >> $GITHUB_STEP_SUMMARY

      - name: Trigger K8s Deploy
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'k8s-deploy.yml',
              ref: 'main',
              inputs: { environment: 'qa', deploy_monitoring: 'false' }
            })
