name: Deploy Applications to Kubernetes

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod
      deploy_monitoring:
        description: 'Deploy monitoring stack?'
        required: false
        type: boolean
        default: false

jobs:
  deploy-k8s:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group rg-jobdirect-${{ github.event.inputs.environment }}-01 \
            --name aks-jobdirect-${{ github.event.inputs.environment }}-01 \
            --overwrite-existing

      - name: Create PostgreSQL Secret
        run: |
          POSTGRES_FQDN=$(az postgres flexible-server show \
            --resource-group rg-jobdirect-${{ github.event.inputs.environment }}-01 \
            --name pg-jobdirect-${{ github.event.inputs.environment }} \
            --query "fullyQualifiedDomainName" -o tsv)

          PASS=""
          if [ "${{ github.event.inputs.environment }}" = "dev" ]; then
            PASS="${{ secrets.POSTGRES_ADMIN_PASSWORD_DEV }}"
          elif [ "${{ github.event.inputs.environment }}" = "qa" ]; then
            PASS="${{ secrets.POSTGRES_ADMIN_PASSWORD_QA }}"
          elif [ "${{ github.event.inputs.environment }}" = "prod" ]; then
            PASS="${{ secrets.POSTGRES_ADMIN_PASSWORD_PROD }}"
          fi

          kubectl create secret generic postgres-secret \
            --from-literal=connection-string="postgresql://jobdirectadmin:${PASS}@${POSTGRES_FQDN}:5432/jobdirect" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Backend
        run: |
          ENV="${{ github.event.inputs.environment }}"
          sed "s|jhosetdev/jobdirect-backend:latest|${{ secrets.DOCKERHUB_USERNAME }}/jobdirect-backend:${ENV}|g" \
            kubernetes/jobdirect-backend.yaml | kubectl apply -f -

      - name: Deploy Frontend
        run: |
          ENV="${{ github.event.inputs.environment }}"
          sed "s|jhosetdev/jobdirect-app:latest|${{ secrets.DOCKERHUB_USERNAME }}/jobdirect-app:${ENV}|g" \
            kubernetes/jobdirect-app.yaml | kubectl apply -f -

      - name: Wait for Deployments
        run: |
          kubectl wait --for=condition=available --timeout=300s \
            deployment/jobdirect-backend || true
          kubectl wait --for=condition=available --timeout=300s \
            deployment/jobdirect-app || true

      - name: Get Service Status
        run: |
          echo "## Deployment Status - ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pods" >> $GITHUB_STEP_SUMMARY
          kubectl get pods >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Services" >> $GITHUB_STEP_SUMMARY
          kubectl get svc >> $GITHUB_STEP_SUMMARY

      - name: Deploy Monitoring (Optional)
        if: ${{ github.event.inputs.deploy_monitoring == 'true' }}
        run: |
          chmod +x kubernetes/setup-monitoring.sh
          ./kubernetes/setup-monitoring.sh ${{ github.event.inputs.environment }}

      - name: Public URLs
        run: |
          FRONTEND_IP=$(kubectl get svc frontend-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          FRONTEND_HOST=$(kubectl get svc frontend-service -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          BACKEND_IP=$(kubectl get svc backend-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          BACKEND_HOST=$(kubectl get svc backend-service -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

          FRONTEND_URL=""
          BACKEND_URL=""

          if [ -n "$FRONTEND_IP" ]; then FRONTEND_URL="http://${FRONTEND_IP}"; fi
          if [ -z "$FRONTEND_URL" ] && [ -n "$FRONTEND_HOST" ]; then FRONTEND_URL="http://${FRONTEND_HOST}"; fi

          if [ -n "$BACKEND_IP" ]; then BACKEND_URL="http://${BACKEND_IP}:3000"; fi
          if [ -z "$BACKEND_URL" ] && [ -n "$BACKEND_HOST" ]; then BACKEND_URL="http://${BACKEND_HOST}:3000"; fi

          echo "## 🌐 Public URLs - ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend:** ${FRONTEND_URL:-Pendiente}" >> $GITHUB_STEP_SUMMARY
          echo "**Backend:** ${BACKEND_URL:-Pendiente}" >> $GITHUB_STEP_SUMMARY
