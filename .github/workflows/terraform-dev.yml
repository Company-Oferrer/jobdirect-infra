name: Deploy Infrastructure - DEV

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'terraform/dev/**'

permissions:
  actions: write
  contents: read

jobs:
  terraform-dev:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        working-directory: terraform/dev
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform/dev
        run: |
          terraform plan -no-color \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var="postgres_admin_password=${{ secrets.POSTGRES_ADMIN_PASSWORD_DEV }}"

      - name: Terraform Apply
        working-directory: terraform/dev
        run: |
          terraform apply -auto-approve \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var="postgres_admin_password=${{ secrets.POSTGRES_ADMIN_PASSWORD_DEV }}"

      - name: Get Outputs
        working-directory: terraform/dev
        run: |
          echo "## Terraform Outputs - DEV" >> $GITHUB_STEP_SUMMARY
          terraform output >> $GITHUB_STEP_SUMMARY

      - name: Trigger K8s Deploy
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.INFRA_DEPLOY_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'k8s-deploy.yml',
              ref: 'main',
              inputs: { environment: 'dev', deploy_monitoring: 'false' }
            })
